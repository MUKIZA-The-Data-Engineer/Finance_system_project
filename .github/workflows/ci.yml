name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint, test, reconcile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check src tests scripts orchestration app
          ruff format --check src tests scripts orchestration app

      - name: Test (pytest, with coverage)
        run: pytest --cov=reconpipe --cov-report=term-missing

      - name: Reconcile end to end (parse, validate, load, dbt build, reports)
        run: python -m reconpipe

      - name: dbt build on its own
        run: dbt build --project-dir dbt --profiles-dir dbt

      - name: Keep the reports
        uses: actions/upload-artifact@v4
        with:
          name: reconciliation-reports
          path: reports/

  docker:
    name: Docker image runs a reconciliation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t reconpipe .
      - name: Run
        run: docker run --rm reconpipe
