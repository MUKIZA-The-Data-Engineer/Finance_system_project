# ReconPipe dbt project. Run from the repository root:
#   dbt build --project-dir dbt --profiles-dir dbt
name: reconpipe
version: "1.0.0"
config-version: 2
profile: reconpipe

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  tier2_window_days: 2       # amount + date: how many days apart bank and ledger may be
  tier3_window_days: 14      # amount + fuzzy description: wider window, needs text evidence
  tier3_min_similarity: 0.4  # 0.5 * word overlap + 0.5 * same counterparty

models:
  reconpipe:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
