[project]
name = "reconpipe"
version = "1.0.0"
description = "Bank statement to ledger reconciliation pipeline."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "duckdb>=1.1",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.38",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "reportlab>=4.0",
    "dagster>=1.8",
    "dagster-webserver>=1.8",
    "streamlit>=1.38",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reconpipe"]

[tool.dagster]
module_name = "orchestration.definitions"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so tests can import the orchestration package
addopts = "-q"

[tool.coverage.run]
source = ["reconpipe"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "orchestration", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
